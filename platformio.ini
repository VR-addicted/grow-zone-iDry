[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Config for 16MB Flash and 8MB PSRAM (common for YD-ESP32-S3 16N8 / N16R8 boards)
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi ; QIO Flash, OPI PSRAM
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    zinggjm/GxEPD2 @ ^1.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit TSL2561 @ ^1.1.2

extra_scripts =
    pre:version_increment.py
    post:copy_firmware.py



